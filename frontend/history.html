<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="禾目 AgriGuard 诊断历史：登录后每次诊断自动留存，可按作物筛选、按关键词搜索。" />
  <meta name="author" content="AgriGuard" />
  <title>我的诊断记录 · 禾目 AgriGuard</title>
  <link rel="icon" type="image/svg+xml" href="/static/logo_icon.svg" />
  <link rel="stylesheet" href="/static/styles.css?v=7" />
  <script src="/static/layout.js?v=7"></script>
</head>
<body data-page="history">
  <div class="app app--wide">
    <main>
      <div class="page-head">
        <h1 class="page-title">我的诊断记录</h1>
        <p class="page-sub">登录后每次诊断都会自动存在这里，不用自己记</p>
      </div>

      <div class="filter-bar" role="search">
        <div class="select-wrap">
          <select id="hist-crop" class="select" aria-label="按作物筛选" disabled>
            <option value="">全部作物</option>
          </select>
          <span class="select-caret" aria-hidden="true">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
          </span>
        </div>

        <div class="search">
          <span class="search-icon" aria-hidden="true">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          </span>
          <input id="hist-q" class="input" type="search" placeholder="搜索病害或作物名称" aria-label="搜索病害或作物名称" />
        </div>

        <button id="hist-clear" class="btn btn-ghost" type="button" aria-label="清除筛选条件">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
          清除
        </button>

        <span class="filter-count" id="hist-count"></span>
      </div>

      <div id="hist-region"></div>
      <div id="hist-loadmore"></div>
    </main>

    <footer>
      <p>智慧农业 · 减肥减药 · 数字乡村</p>
      <p class="footer-note">本作品使用 AI 辅助开发，对外材料已标注「AI 辅助制作」。</p>
      <span
        id="agri-origin-fingerprint"
        data-work="AGRI-GUARD"
        data-ver="v1.0-ext"
        data-ts="2026-09-21"
        data-signature="HM-AG-2026-0920"
        aria-hidden="true"
        class="sr-only"
      >禾目 AgriGuard 原创作品 · AGRI-GUARD / v1.0-ext / 2026-09-21</span>
    </footer>
  </div>

  <script src="/static/history.js?v=7"></script>
</body>
</html>
