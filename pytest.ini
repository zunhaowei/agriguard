[pytest]
# 从仓库根运行：.venv\Scripts\python.exe -m pytest tests -v
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 模型加载 + 预热在首次用例前完成，单条用例可能触发推理，故放宽超时预期
addopts = -ra --strict-markers --durations=5

# 过滤第三方库的无关告警，让真正的失败信号更清晰
filterwarnings =
    ignore::DeprecationWarning:starlette.*
    ignore::UserWarning:ultralytics.*
